name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.1.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_ENV_VALIDATION: "1"
          # prisma.config.ts reads DATABASE_URL directly via Prisma's own env()
          # helper during `prisma generate` (postinstall) -- this is separate from
          # our app's SKIP_ENV_VALIDATION and throws if the var is unset at all.
          # A dummy value is fine; nothing connects to it at build time.
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"

      - name: Build
        run: pnpm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"

      # NOTE: standalone output (`node .next/standalone/server.js`) is intentionally
      # NOT used here -- it hits a Turbopack bug where async external imports (the
      # `pg` driver, pulled in via @prisma/adapter-pg) get compiled to a hashed
      # external reference that never resolves at runtime, crashing every request
      # with a 500. A plain `next start` against the full build output does not
      # hit this bug, so we ship the full build + node_modules instead.
      - name: Package release
        run: |
          mkdir -p /tmp/release
          cp -r .next node_modules package.json prisma prisma.config.ts /tmp/release/
          [ -d public ] && cp -r public /tmp/release/public || true
          tar czf release.tar.gz -C /tmp/release .

      - name: Upload release tarball
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "release.tar.gz"
          target: "/home/ubuntu"

      - name: Activate release and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            RELEASE_DIR="/home/ubuntu/app/releases/${{ github.sha }}"
            mkdir -p "$RELEASE_DIR"
            tar xzf /home/ubuntu/release.tar.gz -C "$RELEASE_DIR"
            rm /home/ubuntu/release.tar.gz
            ln -sfn /home/ubuntu/app/shared/.env "$RELEASE_DIR/.env"
            ln -sfn "$RELEASE_DIR" /home/ubuntu/app/current

            cd /home/ubuntu/app/current
            set -a
            source /home/ubuntu/app/shared/.env
            set +a
            node_modules/.bin/prisma db push --schema=./prisma/schema.prisma

            pm2 describe presentation-ai > /dev/null 2>&1 \
              && pm2 restart presentation-ai --update-env \
              || pm2 start node_modules/.bin/next --name presentation-ai --cwd /home/ubuntu/app/current -- start
            pm2 save

            sleep 3
            curl -f http://localhost:3000/ -o /dev/null -s

            # keep the 5 most recent releases
            cd /home/ubuntu/app/releases
            ls -1t | tail -n +6 | xargs -r rm -rf
